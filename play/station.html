<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>ركّب محطتك</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: one working bench — mission strip on top, the house scene in the middle, the day controls and meters under it. Kit identity: navy, sun amber, teal. */
:root {
  --bg: #FFF6E0; --panel: #FFFDF6; --ink: #12355B; --ink-soft: #3C5875; --line: rgba(18,53,91,.22);
  --sun: #FFB400; --sun-deep: #E2572B; --teal: #1FA3A3; --good: #2E9E5B; --bad: #C2412D;
  --chip: #F3E7C7; --btn-ink: #FFF6E0;
  --f-display: 'Cairo', 'Tajawal', system-ui, sans-serif; --f-body: 'Tajawal', 'Cairo', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1E31; --panel: #142A43; --ink: #EAF1F8; --ink-soft: #A9BDD2; --line: rgba(234,241,248,.18);
  --sun: #FFC233; --sun-deep: #FF7A4D; --teal: #3CC2C2; --good: #49C27A; --bad: #FF6B57; --chip: #1D3757; --btn-ink: #0E1E31; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1E31; --panel: #142A43; --ink: #EAF1F8; --ink-soft: #A9BDD2; --line: rgba(234,241,248,.18);
  --sun: #FFC233; --sun-deep: #FF7A4D; --teal: #3CC2C2; --good: #49C27A; --bad: #FF6B57; --chip: #1D3757; --btn-ink: #0E1E31; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; direction: rtl;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 32px }
.wrap { max-width: 1060px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(24px, 4vw, 34px); margin: 0; line-height: 1.2; text-wrap: balance }
.sub { color: var(--ink-soft); font-size: 15px; margin: 2px 0 0 }
.levels { display: flex; gap: 8px; flex-wrap: wrap }
.lv { font-family: var(--f-display); font-weight: 700; font-size: 15px; border: 2px solid var(--ink); background: var(--panel); color: var(--ink);
  border-radius: 999px; padding: 6px 14px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center }
.lv[aria-pressed="true"] { background: var(--ink); color: var(--btn-ink) }
.lv .done { color: var(--good); font-size: 13px }
.lv[aria-pressed="true"] .done { color: var(--sun) }
.mission { background: var(--sun); color: #12355B; border-radius: 18px; padding: 12px 18px; display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: center }
.mission h2 { font-family: var(--f-display); font-weight: 800; font-size: 21px; margin: 0; line-height: 1.3 }
.mission p { margin: 0; font-size: 16px; font-weight: 500; min-width: 0 }
.mission .hintbtn { grid-row: 1 / span 2; grid-column: 2; font-family: var(--f-display); font-weight: 700; border: 2px solid #12355B; background: #FFF6E0; color: #12355B; border-radius: 12px; padding: 6px 12px; cursor: pointer }
.stage { background: var(--panel); border: 2px solid var(--line); border-radius: 20px; overflow-x: auto; overflow-y: hidden }
svg#scene { display: block; width: 100%; height: auto; touch-action: manipulation; user-select: none }
.howto { font-size: 14.5px; color: var(--ink-soft); font-weight: 700; margin: 0 4px -6px }
.msg { min-height: 52px; border-radius: 14px; padding: 10px 16px; font-size: 16px; font-weight: 500; background: var(--chip); color: var(--ink); display: flex; align-items: center; gap: 10px }
.msg.good { background: var(--good); color: #fff }
.msg.bad { background: var(--bad); color: #fff }
.msg b { font-family: var(--f-display) }
.bar { display: flex; flex-direction: column; gap: 10px }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px }
.btn { font-family: var(--f-display); font-weight: 700; font-size: 15.5px; border: 2px solid var(--ink); background: var(--panel); color: var(--ink); border-radius: 12px; padding: 7px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px }
.btn.primary { background: var(--ink); color: var(--btn-ink) }
.btn[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: #fff }
.btn:disabled { opacity: .4; cursor: default }
.clock { font-family: var(--f-display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; direction: ltr; min-width: 82px; text-align: center }
.panels { display: inline-flex; align-items: center; gap: 6px; border-inline-start: 2px solid var(--line); padding-inline-start: 10px }
.panels .n { font-family: var(--f-display); font-weight: 800; font-size: 20px; min-width: 18px; text-align: center }
.meters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px }
.meter { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 8px 12px; min-width: 0 }
.meter .k { font-size: 13.5px; color: var(--ink-soft); font-weight: 700 }
.meter .v { font-family: var(--f-display); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.3 }
.meter .u { font-size: 13px; color: var(--ink-soft); font-weight: 700 }
.meter .track { height: 8px; background: var(--chip); border-radius: 999px; overflow: hidden; margin-top: 4px }
.meter .fill { height: 100%; width: 0; background: var(--sun); border-radius: 999px; transition: width .2s }
.info { background: var(--panel); border: 2px dashed var(--line); border-radius: 16px; padding: 10px 16px; font-size: 15.5px }
.info b { font-family: var(--f-display); font-size: 17px }
button:focus-visible { outline: 3px solid var(--sun-deep); outline-offset: 2px }
.hit { cursor: pointer }
.hit:focus-visible { outline: none }
.hit:focus-visible .ring { stroke: var(--sun-deep); stroke-width: 4 }
@media (max-width: 760px) { .mission { grid-template-columns: 1fr } .mission .hintbtn { grid-row: auto; grid-column: auto; justify-self: start } .lbl { font-size: 30px; stroke-width: 8px } }
@media (max-width: 460px) { .lbl { font-size: 36px } .meters { gap: 6px } .meter { padding: 6px 8px } .meter .k { font-size: 12px } .meter .v { font-size: 18px } .clock { font-size: 22px; min-width: 66px } }
@media (prefers-reduced-motion: reduce) { .meter .fill { transition: none } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>ركّب محطتك!</h1>
      <p class="sub">صيّاد الشمس · الوحدة 6 · مهد لابز</p>
    </div>
    <nav class="levels" id="levels" aria-label="المستويات"></nav>
  </header>

  <section class="mission" aria-live="polite">
    <h2 id="mTitle"></h2>
    <p id="mGoal"></p>
    <button class="hintbtn" id="hintBtn" type="button">تلميح</button>
  </section>

  <p class="howto">انقر قطعة ثم قطعة أخرى لتربطهما بسلك · انقر السلك لحذفه</p>
  <div class="stage">
    <svg id="scene" viewBox="0 30 1000 610" role="img" aria-label="بيت بسطح فيه ألواح شمسية وقطع المحطة"></svg>
  </div>

  <div class="msg" id="msg" role="status" aria-live="polite"></div>

  <div class="bar">
    <div class="controls">
      <div class="clock" id="clock">10:00</div>
      <button class="btn primary" id="playBtn" type="button">▶ شغّل اليوم</button>
      <button class="btn" id="fastBtn" type="button" aria-pressed="false">سريع ×3</button>
      <button class="btn" id="cloudBtn" type="button" aria-pressed="false">غيمة</button>
      <button class="btn" id="resetBtn" type="button">يوم جديد</button>
      <button class="btn" id="clearBtn" type="button">احذف الأسلاك</button>
      <span class="panels" id="panelsBox" hidden>
        <span>الألواح:</span>
        <button class="btn" id="minusP" type="button" aria-label="لوح أقل">−</button>
        <span class="n" id="nP">1</span>
        <button class="btn" id="plusP" type="button" aria-label="لوح أكثر">+</button>
      </span>
    </div>
    <div class="meters">
      <div class="meter"><div class="k">إنتاج الألواح الآن</div><div class="v"><span id="vProd">0</span> <span class="u">وحدة/ساعة</span></div><div class="track"><div class="fill" id="fProd"></div></div></div>
      <div class="meter"><div class="k">استهلاك الأجهزة الآن</div><div class="v"><span id="vUse">0</span> <span class="u">وحدة/ساعة</span></div><div class="track"><div class="fill" id="fUse" style="background:var(--teal)"></div></div></div>
      <div class="meter"><div class="k">مخزون البطارية</div><div class="v" id="vBat">—</div><div class="track"><div class="fill" id="fBat" style="background:var(--good)"></div></div></div>
    </div>
  </div>

  <div class="info" id="info"><b>ما وظيفة كل قطعة؟</b> انقر على أي قطعة لتقرأ دورها في المحطة.</div>
</div>

<script>
(() => {
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('scene');
const $ = id => document.getElementById(id);

// ---------- model ----------
const TYPE_ORDER = ['panel', 'ctrl', 'batt', 'inv', 'lamp', 'fridge', 'pump'];
const DEF = { panel: 'اللوح', ctrl: 'المنظم', batt: 'البطارية', inv: 'المحوّل', lamp: 'المصباح', fridge: 'الثلاجة', pump: 'المضخة' };
const NAMES = { panel: 'لوح شمسي', ctrl: 'منظم الشحن', batt: 'بطارية', inv: 'محوّل', lamp: 'مصباح', fridge: 'ثلاجة', pump: 'مضخة ماء' };
const ROLES = {
  panel: 'يحوّل ضوء الشمس إلى كهرباء. يعطي أكثر حين تكون الشمس عالية، ولا يعطي شيئا في الليل.',
  ctrl: 'عقل المحطة: يأخذ كهرباء الألواح ويوزّعها، ويحمي البطارية من الشحن الزائد ومن الفراغ الكامل.',
  batt: 'تخزّن كهرباء النهار لنستعملها في الليل أو حين تختفي الشمس خلف الغيوم.',
  inv: 'يحوّل كهرباء البطارية (12 فولت) إلى كهرباء مثل كهرباء المقبس (220 فولت) لتعمل بها الأجهزة الكبيرة.',
  lamp: 'مصباح LED صغير يعمل بكهرباء الألواح أو البطارية مباشرة (12 فولت). يستهلك قليلا.',
  fridge: 'تعمل بكهرباء المقبس (220 فولت)، فلا بد لها من محوّل. تشتغل طوال اليوم.',
  pump: 'ترفع الماء من البئر لسقي الحديقة. تستهلك كثيرا وتعمل بـ220 فولت، فتحتاج محوّلا.'
};
const RATE = { lamp: 1, fridge: 0.4, pump: 2.5 };       // units per hour
const PANEL_MAX = 2;                                     // units per hour at full sun
const BATT_CAP = 12;
const ALLOWED = new Set(['panel-ctrl', 'panel-lamp', 'ctrl-batt', 'ctrl-lamp', 'batt-lamp', 'batt-inv', 'ctrl-inv', 'inv-lamp', 'inv-fridge', 'inv-pump']);
const POS = {
  p1: [165, 262], p2: [270, 262], p3: [375, 262], p4: [480, 262], p5: [585, 262],
  ctrl: [205, 405], batt: [205, 530], inv: [385, 470],
  lamp: [545, 375], fridge: [545, 520], pump: [830, 540]
};
const LEVELS = [
  { title: 'المستوى 1 · ضوء النهار', goal: 'أضئ المصباح في النهار بكهرباء الشمس.',
    comps: ['ctrlless'], ids: ['lamp'], panels: 1, start: 10, batt: 0, demand: { lamp: [[6, 24]] }, kind: 'instant',
    hints: ['المصباح يحتاج مصدرا للكهرباء. ما الذي يصنع الكهرباء من الضوء؟', 'اربط اللوح الشمسي بالمصباح مباشرة.', 'بعد أن يضيء، شغّل اليوم وانظر ماذا يحدث للمصباح عند الغروب.'],
    win: 'رائع! اللوح يحوّل ضوء الشمس إلى كهرباء. شغّل اليوم الآن وراقب المصباح عند الغروب: ماذا يحدث؟ ولماذا؟' },
  { title: 'المستوى 2 · ضوء الليل', goal: 'اجعل المصباح يضيء من 18:00 حتى منتصف الليل. شغّل اليوم من الصباح.',
    ids: ['ctrl', 'batt', 'lamp'], panels: 1, start: 6, batt: 0, demand: { lamp: [[18, 24]] }, kind: 'day',
    hints: ['في الليل لا ينتج اللوح شيئا. أين نخزّن كهرباء النهار؟', 'اللوح ← المنظم ← البطارية. ثم اربط المصباح بالبطارية أو بالمنظم.', 'شغّل اليوم من 6:00 حتى تمتلئ البطارية قبل الغروب.'],
    win: 'ليلة مضيئة! البطارية خزّنت كهرباء النهار، فأضاء المصباح بعد غياب الشمس.' },
  { title: 'المستوى 3 · ثلاجة لا تتوقف', goal: 'شغّل الثلاجة طوال اليوم، والمصباح من 18:00 حتى منتصف الليل.',
    ids: ['ctrl', 'batt', 'inv', 'lamp', 'fridge'], panels: 1, start: 6, batt: 3, demand: { fridge: [[6, 24]], lamp: [[18, 24]] }, kind: 'day',
    hints: ['الثلاجة لا تعمل بكهرباء البطارية مباشرة. تحتاج كهرباء مثل كهرباء المقبس.', 'أضف المحوّل: البطارية ← المحوّل ← الثلاجة.', 'لا تنس المصباح والبطارية والمنظم من المستوى السابق.'],
    win: 'ممتاز! المحوّل جعل كهرباء البطارية صالحة للثلاجة، فبقيت باردة نهارا وليلا.' },
  { title: 'المستوى 4 · بيت الجدة في الدوار', goal: 'تريد الجدة مضخة تسقي الحديقة من 10:00 إلى 16:00، وضوءا من 18:00 إلى منتصف الليل. استعمل أقل عدد من الألواح.',
    ids: ['ctrl', 'batt', 'inv', 'lamp', 'pump'], panels: 1, maxPanels: 5, start: 6, batt: 3, demand: { pump: [[10, 16]], lamp: [[18, 24]] }, kind: 'day',
    hints: ['المضخة تستهلك كثيرا في النهار، والمصباح يحتاج مخزونا لليل.', 'كل لوح يجب أن يُربط بالمنظم. جرّب لوحا واحدا، ثم لوحين.', 'جرّب أيضا زر الغيمة: هل يكفي عدد الألواح نفسه في يوم غائم؟'],
    win: null }
];

let L = 0, level = LEVELS[0];
let edges = new Map();           // key "a|b" (sorted) -> {a,b}
let selected = null;
let t = 10, playing = false, fast = false, cloud = false, nPanels = 1;
let charge = 0, unmet = {}, failed = false, won = false, playedFromStart = false, hintIdx = 0;
let flows = new Map(), state = {};
let done = new Set();
try { JSON.parse(localStorage.getItem('station-done') || '[]').forEach(x => done.add(x)); } catch (e) {}

const typeOf = id => id[0] === 'p' && /^p\d$/.test(id) ? 'panel' : id;
const key = (a, b) => [a, b].sort().join('|');
const pairType = (a, b) => [typeOf(a), typeOf(b)].sort((x, y) => TYPE_ORDER.indexOf(x) - TYPE_ORDER.indexOf(y)).join('-');
const ids = () => [...Array(nPanels)].map((_, i) => 'p' + (i + 1)).concat(level.ids);
const sun = h => (h > 6 && h < 18) ? Math.sin(Math.PI * (h - 6) / 12) : 0;
const fmt = h => { const hh = Math.floor(h) % 24, mm = Math.floor((h - Math.floor(h)) * 60); return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0'); };
const wanted = (load, h) => (level.demand[load] || []).some(([a, b]) => h >= a && h < b);
const has = (a, b) => edges.has(key(a, b));
const hasType = (id, type) => [...edges.values()].some(e => (e.a === id && typeOf(e.b) === type) || (e.b === id && typeOf(e.a) === type));

function badLinkMessage(a, b) {
  const p = pairType(a, b), [x, y] = p.split('-');
  if (x === y && x === 'panel') return 'ربط الألواح ببعضها يرفع الجهد كما في تجربتك! لكن هنا نربط كل لوح بالمنظم، وهو يجمعها.';
  if (p === 'panel-batt') return 'لا نربط اللوح بالبطارية مباشرة: منظم الشحن يحميها من الشحن الزائد. ضع المنظم بينهما.';
  if (p === 'panel-inv') return 'المحوّل يأخذ كهرباءه من البطارية أو المنظم، لا من اللوح مباشرة.';
  if (['fridge', 'pump'].includes(y) && x !== 'inv') return DEF[y] + ' تعمل بكهرباء المقبس (220 فولت). تحتاج محوّلا بينها وبين ' + DEF[x] + '.';
  if (['lamp', 'fridge', 'pump'].includes(x) && ['lamp', 'fridge', 'pump'].includes(y)) return 'الأجهزة لا تعطي كهرباء لبعضها. كل جهاز يحتاج مصدرا: لوحا أو بطارية أو محوّلا.';
  return 'هذا الربط لا يفيد في المحطة. فكّر: من أين تأتي الكهرباء، وإلى أين تذهب؟';
}

// ---------- simulation ----------
function compute(dt) {
  const s = sun(t) * (cloud ? 0.35 : 1);
  const panelIds = ids().filter(i => typeOf(i) === 'panel');
  const toCtrl = panelIds.filter(p => level.ids.includes('ctrl') && has(p, 'ctrl'));
  const toLamp = panelIds.filter(p => has(p, 'lamp'));
  const prodCtrl = toCtrl.length * PANEL_MAX * s;
  const prodDirect = toLamp.length * PANEL_MAX * s;
  flows = new Map();
  const on = { lamp: false, fridge: false, pump: false };
  let use = 0, prodShown = 0, chargingFlow = 0;

  // groups among ctrl/batt/inv
  const hub = ['ctrl', 'batt', 'inv'].filter(x => level.ids.includes(x));
  const seen = new Set(), groups = [];
  for (const h of hub) {
    if (seen.has(h)) continue;
    const g = [h]; seen.add(h);
    for (let i = 0; i < g.length; i++) for (const o of hub) if (!seen.has(o) && has(g[i], o)) { seen.add(o); g.push(o); }
    groups.push(g);
  }
  const battCanCharge = groups.some(g => g.includes('ctrl') && g.includes('batt'));

  for (const g of groups) {
    const hasC = g.includes('ctrl'), hasB = g.includes('batt'), hasI = g.includes('inv');
    const solar = hasC ? prodCtrl : 0;
    if (hasC) prodShown += prodCtrl;
    const loads = [];
    if (level.ids.includes('lamp') && (g.some(n => n !== 'inv' && has(n, 'lamp')) || (hasI && has('inv', 'lamp')))) loads.push('lamp');
    if (hasI && level.ids.includes('fridge') && has('inv', 'fridge')) loads.push('fridge');
    if (hasI && level.ids.includes('pump') && has('inv', 'pump')) loads.push('pump');
    let avail = solar + (hasB ? charge / Math.max(dt, 1e-6) : 0);
    if (dt === 0) avail = solar + (hasB && charge > 0.01 ? 99 : 0);
    let used = 0;
    for (const ld of ['lamp', 'fridge', 'pump']) {
      if (!loads.includes(ld) || !wanted(ld, t)) continue;
      if (avail - used >= RATE[ld] - 1e-9) { used += RATE[ld]; on[ld] = true; }
    }
    use += used;
    const net = solar - used;
    if (hasB) {
      if (net >= 0) { if (hasC && battCanCharge) { const add = Math.min(net * dt, BATT_CAP - charge); charge += add; chargingFlow = net; } }
      else { charge = Math.max(0, charge + net * dt); chargingFlow = net; }
    }
    // flows for animation
    for (const p of toCtrl) if (hasC) flows.set(key(p, 'ctrl'), { from: p, amt: PANEL_MAX * s });
    if (hasB && hasC && has('ctrl', 'batt')) {
      const f = hasB ? (net >= 0 ? (charge < BATT_CAP - 0.01 ? net : 0) : net) : 0;
      if (Math.abs(f) > 0.01) flows.set(key('ctrl', 'batt'), { from: f > 0 ? 'ctrl' : 'batt', amt: Math.abs(f) });
    }
    const acUse = (on.fridge ? RATE.fridge : 0) + (on.pump ? RATE.pump : 0) + (on.lamp && has('inv', 'lamp') && !g.some(n => n !== 'inv' && has(n, 'lamp')) ? RATE.lamp : 0);
    if (hasI && acUse > 0) {
      const src = ['batt', 'ctrl'].find(n => g.includes(n) && has(n, 'inv'));
      if (src) flows.set(key(src, 'inv'), { from: src, amt: acUse });
      if (on.fridge) flows.set(key('inv', 'fridge'), { from: 'inv', amt: RATE.fridge });
      if (on.pump) flows.set(key('inv', 'pump'), { from: 'inv', amt: RATE.pump });
    }
    if (on.lamp && loads.includes('lamp')) {
      const src = ['batt', 'ctrl', 'inv'].find(n => g.includes(n) && has(n, 'lamp'));
      if (src) flows.set(key(src, 'lamp'), { from: src, amt: RATE.lamp });
