<style>
/* Layout: a passport booklet — navy cover with the holder's name, a page of eight stamp slots, then the stamp quiz and the certificate. Kit identity: navy, sun amber, teal, stamp red. */
:root {
  --bg: #FFF6E0; --paper: #FFFDF6; --ink: #12355B; --ink-soft: #3C5875; --line: rgba(18,53,91,.22);
  --sun: #FFB400; --sun-deep: #E2572B; --teal: #1FA3A3; --good: #2E9E5B; --bad: #C2412D; --stamp: #B8431C; --chip: #F3E7C7; --cover: #12355B; --cover-ink: #FFF6E0;
  --f-display: 'Cairo', 'Tajawal', system-ui, sans-serif; --f-body: 'Tajawal', 'Cairo', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1E31; --paper: #142A43; --ink: #EAF1F8; --ink-soft: #A9BDD2; --line: rgba(234,241,248,.18);
  --sun: #FFC233; --sun-deep: #FF7A4D; --teal: #3CC2C2; --good: #49C27A; --bad: #FF6B57; --stamp: #FF8A5C; --chip: #1D3757; --cover: #0A1626; --cover-ink: #FFF6E0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1E31; --paper: #142A43; --ink: #EAF1F8; --ink-soft: #A9BDD2; --line: rgba(234,241,248,.18);
  --sun: #FFC233; --sun-deep: #FF7A4D; --teal: #3CC2C2; --good: #49C27A; --bad: #FF6B57; --stamp: #FF8A5C; --chip: #1D3757; --cover: #0A1626; --cover-ink: #FFF6E0; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; direction: rtl;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 32px }
.wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px }
.cover { background: var(--cover); color: var(--cover-ink); border-radius: 22px; padding: 20px 24px; display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; box-shadow: 0 8px 0 rgba(0,0,0,.12) }
.cover h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(26px, 5vw, 38px); margin: 0; line-height: 1.15; color: var(--sun) }
.cover p { margin: 2px 0 0; font-size: 15px; opacity: .9 }
.namebox { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap }
.namebox label { font-weight: 700 }
.namebox input { font-family: var(--f-display); font-weight: 700; font-size: 18px; border: 2px solid var(--sun); background: transparent; color: var(--cover-ink); border-radius: 10px; padding: 4px 10px; min-width: 0; flex: 1; max-width: 300px }
.progress { font-family: var(--f-display); font-weight: 800; font-size: 15px; color: var(--sun) }
.stamps { background: var(--paper); border: 2px solid var(--line); border-radius: 22px; padding: 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px;
  background-image: repeating-linear-gradient(0deg, transparent 0 27px, rgba(18,53,91,.05) 27px 28px) }
.slot { border: none; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink); font-family: var(--f-body); padding: 4px; border-radius: 14px; min-width: 0 }
.slot:hover .ring { transform: scale(1.04) }
.slot:focus-visible { outline: 3px solid var(--sun-deep); outline-offset: 2px }
.ring { width: 100%; max-width: 132px; aspect-ratio: 1; border-radius: 50%; border: 3px dashed var(--line); display: flex; align-items: center; justify-content: center; transition: transform .15s; position: relative }
.ring .n { font-family: var(--f-display); font-weight: 900; font-size: 34px; color: var(--line) }
.slot.got .ring { border: 4px double var(--stamp); color: var(--stamp); transform: rotate(-8deg) }
.slot.got .ring svg { width: 82% }
.slot .lbl { font-family: var(--f-display); font-weight: 800; font-size: 14.5px; text-align: center; line-height: 1.3 }
.slot .st { font-size: 12.5px; color: var(--ink-soft) }
.slot.got .st { color: var(--good); font-weight: 700 }
.quiz { background: var(--paper); border: 2px solid var(--line); border-radius: 22px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px }
.quiz h2 { font-family: var(--f-display); font-weight: 800; font-size: 22px; margin: 0 }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap }
.dots { display: flex; gap: 6px }
.dots span { width: 12px; height: 12px; border-radius: 50%; background: var(--chip) }
.dots span.ok { background: var(--good) } .dots span.no { background: var(--bad) } .dots span.cur { outline: 2px solid var(--ink) }
.q { font-family: var(--f-display); font-weight: 800; font-size: 19px; line-height: 1.45 }
.opts { display: flex; flex-direction: column; gap: 8px }
.opt { text-align: right; font-family: var(--f-body); font-size: 17px; font-weight: 500; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 14px; padding: 10px 14px; cursor: pointer; min-height: 48px }
.opt:focus-visible { outline: 3px solid var(--sun-deep); outline-offset: 2px }
.opt.right { background: var(--good); border-color: var(--good); color: #fff }
.opt.wrong { background: var(--bad); border-color: var(--bad); color: #fff }
.opt:disabled { cursor: default }
.fb { border-radius: 14px; padding: 10px 14px; background: var(--chip); font-size: 15.5px }
.fb b { font-family: var(--f-display) }
.row { display: flex; gap: 8px; flex-wrap: wrap }
.btn { font-family: var(--f-display); font-weight: 800; font-size: 16px; border: 2px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 12px; padding: 8px 16px; cursor: pointer; min-height: 44px }
.btn.ghost { background: var(--paper); color: var(--ink) }
.btn:focus-visible { outline: 3px solid var(--sun-deep); outline-offset: 2px }
.result { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px }
.result .big { font-family: var(--f-display); font-weight: 900; font-size: 30px }
.cert { background: var(--paper); border: 6px double var(--sun-deep); border-radius: 22px; padding: 22px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px }
.cert h2 { font-family: var(--f-display); font-weight: 900; font-size: clamp(24px, 5vw, 34px); color: var(--sun-deep); margin: 0 }
.cert .who { font-family: var(--f-display); font-weight: 900; font-size: clamp(26px, 6vw, 40px); border-bottom: 3px solid var(--sun); padding: 0 18px; min-width: 60% }
.cert p { margin: 0; max-width: 560px }
.small { font-size: 13.5px; color: var(--ink-soft) }
@media (max-width: 620px) { .stamps { grid-template-columns: repeat(2, minmax(0, 1fr)) } .cover { grid-template-columns: 1fr } .cover svg { width: 70px } }
@media (prefers-reduced-motion: reduce) { .ring { transition: none } }
</style>

  panel: '<path d="M14 72 L28 30 H86 L72 72 Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/><path d="M21 51 H79 M47 30 L40 72 M67 30 L60 72" stroke="currentColor" stroke-width="3"/>',
  house: '<path d="M18 86 V46 L50 18 L82 46 V86 Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/><path d="M44 50 L36 66 H48 L40 82" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>',
  tower: '<path d="M42 88 L46 22 H54 L58 88" fill="none" stroke="currentColor" stroke-width="6"/><rect x="40" y="10" width="20" height="14" fill="currentColor"/><path d="M14 80 L30 72 M70 72 L86 80" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>',
  lens: '<circle cx="42" cy="42" r="24" fill="none" stroke="currentColor" stroke-width="7"/><path d="M60 60 L84 84" stroke="currentColor" stroke-width="9" stroke-linecap="round"/>'
};
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let got = store.get('passport-stamps', {});   // unit index -> date string
const nm = $('nm'); nm.value = store.get('passport-name', '');
nm.addEventListener('input', () => { store.set('passport-name', nm.value.trim()); renderCert(); });

function renderStamps() {
  const box = $('stamps'); box.innerHTML = '';
  UNITS.forEach((u, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'slot' + (got[i] ? ' got' : '');
    b.setAttribute('aria-label', `الوحدة ${i + 1}: ${u.t}` + (got[i] ? ' (مختومة)' : ''));
    b.innerHTML = `<span class="ring">${got[i] ? `<svg viewBox="0 0 100 100" aria-hidden="true">${ICONS[u.icon]}</svg>` : `<span class="n">${i + 1}</span>`}</span><span class="lbl">الوحدة ${i + 1}<br>${u.t}</span><span class="st">${got[i] ? 'مختومة · ' + got[i] : 'اضغط لتربح الختم'}</span>`;
    b.onclick = () => startQuiz(i);
    box.appendChild(b);
  });
  const n = Object.keys(got).length;
  $('prog').textContent = `الأختام: ${n} من 8`;
  renderCert();
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let Q = null;
function startQuiz(i) { Q = { u: i, k: 0, res: [] }; $('quiz').hidden = false; renderQ(); $('quiz').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); }
function renderQ() {
  const u = UNITS[Q.u], box = $('quiz');
  const dots = u.qs.map((_, j) => `<span class="${Q.res[j] === true ? 'ok' : Q.res[j] === false ? 'no' : ''}${j === Q.k ? ' cur' : ''}"></span>`).join('');
  if (Q.k >= u.qs.length) return renderResult();
  const [q, opts, why] = u.qs[Q.k];
  const sh = shuffle(opts.map((o, j) => ({ o, ok: j === 0 })));
  box.innerHTML = `<div class="qhead"><h2>الوحدة ${Q.u + 1}: ${u.t}</h2><div class="dots" aria-label="السؤال ${Q.k + 1} من 5">${dots}</div></div>
    <div class="q">${Q.k + 1}. ${q}</div><div class="opts">${sh.map((x, j) => `<button type="button" class="opt" data-j="${j}">${x.o}</button>`).join('')}</div><div id="fbx"></div>`;
  box.querySelectorAll('.opt').forEach(btn => btn.onclick = () => {
    const ok = sh[+btn.dataset.j].ok; Q.res[Q.k] = ok;
    box.querySelectorAll('.opt').forEach((b, j) => { b.disabled = true; if (sh[j].ok) b.classList.add('right'); });
    if (!ok) btn.classList.add('wrong');
    $('fbx').innerHTML = `<div class="fb" role="status"><b>${ok ? 'أحسنت!' : 'ليس تماما.'}</b> ${why}</div><div class="row" style="margin-top:10px"><button type="button" class="btn" id="nx">${Q.k < 4 ? 'السؤال التالي' : 'النتيجة'}</button></div>`;
    $('nx').onclick = () => { Q.k++; renderQ(); }; $('nx').focus();
  });
}
function renderResult() {
  const u = UNITS[Q.u], score = Q.res.filter(Boolean).length, pass = score >= 4, box = $('quiz');
  if (pass && !got[Q.u]) { got[Q.u] = new Date().toLocaleDateString('ar-MA'); store.set('passport-stamps', got); }
  box.innerHTML = `<div class="result"><div class="big">${score} من 5</div>
    <div>${pass ? `<b>ختم جديد!</b> ربحت ختم الوحدة ${Q.u + 1}: ${u.t}.` : 'تحتاج 4 أجوبة صحيحة على الأقل لتربح الختم. راجع دفترك وبطاقات الوحدة ثم حاول من جديد.'}</div>
    <div class="row" style="justify-content:center"><button type="button" class="btn" id="again">${pass ? 'أعد اللعب' : 'حاول من جديد'}</button><button type="button" class="btn ghost" id="back">العودة إلى الجواز</button></div></div>`;
  $('again').onclick = () => startQuiz(Q.u);
  $('back').onclick = () => { box.hidden = true; $('stamps').scrollIntoView({ block: 'start' }); };
  renderStamps();
}
function renderCert() {
  const n = Object.keys(got).length, c = $('cert');
  if (n < 8) { c.hidden = true; return; }
  c.hidden = false;
  const name = nm.value.trim() || 'صياد الشمس';
  c.innerHTML = `<h2>شهادة صياد الشمس</h2><p>تشهد مهد لابز أن</p><div class="who">${name.replace(/[<>&]/g, '')}</div>
    <p>جمع الأختام الثمانية، فتعلّم كيف يرصد الشمس، ويصطاد حرارتها، ويحوّل ضوءها إلى كهرباء، ويفهم محطة نور، ويبحث في الميدان كالعلماء.</p>
    <p class="small">صيّاد الشمس · مهد لابز · من مهد الإبداع · by Creativity Cradle</p><p class="small">التقط صورة لهذه الشهادة واحتفظ بها!</p>`;
}
renderStamps();
})();
</script>
